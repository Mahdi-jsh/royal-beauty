<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور | رویال بیوتی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <a href="index.html" style="position:absolute;top:2rem;right:2rem;color:var(--accent);"><i class="fas fa-arrow-right"></i> بازگشت</a>

    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo" style="justify-content:center;margin-bottom:1rem;">
                    <div class="logo-icon"><i class="fas fa-crown"></i></div>
                    <span class="logo-text">رویال بیوتی</span>
                </a>
                <div style="width:80px;height:80px;background:var(--primary-light);border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2rem;color:var(--primary);">
                    <i class="fas fa-key"></i>
                </div>
                <h1>رمز عبور را فراموش کردید؟</h1>
                <p>ایمیل خود را وارد کنید تا لینک بازیابی برایتان ارسال شود</p>
            </div>

            <form data-validate>
                <div class="form-group">
                    <label class="form-label">ایمیل</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-control with-icon" placeholder="email@example.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-paper-plane"></i> ارسال لینک بازیابی
                </button>
            </form>

            <p style="text-align:center;margin-top:1.5rem;color:var(--gray);">
                <a href="login.html" class="form-link"><i class="fas fa-arrow-right"></i> بازگشت به صفحه ورود</a>
            </p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
