<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
    font-family: 'Tahoma', sans-serif;
  }
  .banner {
    width: 1200px;
    height: 400px;
    background: #0f0f1e;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 70px;
  }
  .left-content {
    flex: 1;
    color: white;
  }
  .label {
    color: #ff6b9d;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 15px;
  }
  .title {
    font-size: 52px;
    font-weight: bold;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  .title span {
    color: #00d4ff;
  }
  .desc {
    font-size: 18px;
    color: #a0a0b8;
    margin-bottom: 30px;
    line-height: 1.6;
  }
  .tech-stack {
    display: flex;
    gap: 12px;
  }
  .tech {
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid #00d4ff;
    color: #00d4ff;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
  }
  .right-content {
    width: 350px;
    height: 350px;
    background: linear-gradient(45deg, #00d4ff, #ff6b9d);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 150px;
    position: relative;
  }
  .right-content::before {
    content: '';
    position: absolute;
    width: 320px;
    height: 320px;
    background: #0f0f1e;
    border-radius: 50%;
  }
  .right-content::after {
    content: '{ }';
    position: relative;
    color: white;
    font-size: 80px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="left-content">
      <div class="label">FRONT-END DEVELOPER</div>
      <h1 class="title">کدنویسی <span>حرفه‌ای</span><br>صفحات وب</h1>
      <p class="desc">طراحی مدرن، کدنویسی تمیز و ریسپانسیو<br>با جدیدترین تکنولوژی‌های روز</p>
      <div class="tech-stack">
        <div class="tech">HTML5</div>
        <div class="tech">CSS3</div>
        <div class="tech">JS</div>
      </div>
    </div>
    <div class="right-content"></div>
  </div>
</body>
</html>
